[package]
name = "navegante-desktop"
version = "2.1.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/tiagofdias/NaveganteWeb"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["ico"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
